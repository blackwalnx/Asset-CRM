services:
  - name: api-server
    type: web
    env: docker
    dockerfilePath: ./artifacts/api-server/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: REPL_ID
        sync: false

  - name: crm-frontend
    type: static_site
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/crm run build
    publishDir: artifacts/crm/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
