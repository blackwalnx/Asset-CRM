openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Think Tank CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: contacts
    description: Contact management
  - name: interactions
    description: Interaction log management
  - name: users
    description: User role management
  - name: dashboard
    description: Dashboard statistics
  - name: audit
    description: Audit log

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect on success or failure.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: relationship_level
          in: query
          required: false
          schema:
            type: string
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"

    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    put:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    delete:
      operationId: archiveContact
      tags: [contacts]
      summary: Archive (soft delete) a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /contacts/submit:
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Public/internal contact submission form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContactRequest"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /interactions:
    get:
      operationId: listInteractions
      tags: [interactions]
      summary: List all interactions
      parameters:
        - name: contact_id
          in: query
          required: false
          schema:
            type: string
        - name: follow_up_required
          in: query
          required: false
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of interactions
          content:
            application/json:
              schema:
                type: object
                required: [interactions]
                properties:
                  interactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Interaction"

    post:
      operationId: createInteraction
      tags: [interactions]
      summary: Log a new interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInteractionRequest"
      responses:
        "201":
          description: Interaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /interactions/{id}:
    get:
      operationId: getInteraction
      tags: [interactions]
      summary: Get an interaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    put:
      operationId: updateInteraction
      tags: [interactions]
      summary: Update an interaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInteractionRequest"
      responses:
        "200":
          description: Updated interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all CRM users and roles
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrmUser"

  /users/{id}/role:
    put:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Contact:
      type: object
      required: [id, contactId, fullName, category, organization, sector, officialEmail, city, state, relationshipLevel, sensitivityLevel, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
        contactId:
          type: string
        fullName:
          type: string
        designation:
          type: [string, 'null']
        category:
          type: string
        organization:
          type: string
        sector:
          type: string
        officialEmail:
          type: string
        personalEmail:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        city:
          type: string
        state:
          type: string
        relationshipLevel:
          type: string
        sensitivityLevel:
          type: string
        lastVerifiedDate:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        confidentialNotes:
          type: [string, 'null']
        policyDomains:
          type: array
          items:
            type: string
        engagementScore:
          type: number
        archived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateContactRequest:
      type: object
      required: [fullName, category, organization, sector, officialEmail, city, state]
      properties:
        fullName:
          type: string
        designation:
          type: string
        category:
          type: string
        organization:
          type: string
        sector:
          type: string
        officialEmail:
          type: string
          format: email
        personalEmail:
          type: string
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        relationshipLevel:
          type: string
        sensitivityLevel:
          type: string
        notes:
          type: string
        confidentialNotes:
          type: string
        policyDomains:
          type: array
          items:
            type: string

    UpdateContactRequest:
      type: object
      properties:
        fullName:
          type: string
        designation:
          type: string
        category:
          type: string
        organization:
          type: string
        sector:
          type: string
        officialEmail:
          type: string
        personalEmail:
          type: string
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        relationshipLevel:
          type: string
        sensitivityLevel:
          type: string
        lastVerifiedDate:
          type: string
        notes:
          type: string
        confidentialNotes:
          type: string
        policyDomains:
          type: array
          items:
            type: string
        archived:
          type: boolean

    SubmitContactRequest:
      type: object
      required: [fullName, organization, officialEmail]
      properties:
        fullName:
          type: string
        designation:
          type: string
        organization:
          type: string
        officialEmail:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
        state:
          type: string
        notes:
          type: string
        policyDomains:
          type: array
          items:
            type: string

    Interaction:
      type: object
      required: [id, contactId, date, engagementType, policyDomain, outcome, followUpRequired, sensitivityFlag, createdAt]
      properties:
        id:
          type: string
        contactId:
          type: string
        contactName:
          type: [string, 'null']
        date:
          type: string
        engagementType:
          type: string
        policyDomain:
          type: string
        outcome:
          type: string
        followUpRequired:
          type: boolean
        followUpDate:
          type: [string, 'null']
        sensitivityFlag:
          type: boolean
        notes:
          type: [string, 'null']
        createdBy:
          type: [string, 'null']
        createdAt:
          type: string

    CreateInteractionRequest:
      type: object
      required: [contactId, date, engagementType, policyDomain, outcome]
      properties:
        contactId:
          type: string
        date:
          type: string
        engagementType:
          type: string
        policyDomain:
          type: string
        outcome:
          type: string
        followUpRequired:
          type: boolean
        followUpDate:
          type: string
        sensitivityFlag:
          type: boolean
        notes:
          type: string

    UpdateInteractionRequest:
      type: object
      properties:
        date:
          type: string
        engagementType:
          type: string
        policyDomain:
          type: string
        outcome:
          type: string
        followUpRequired:
          type: boolean
        followUpDate:
          type: string
        sensitivityFlag:
          type: boolean
        notes:
          type: string

    CrmUser:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
        status:
          type: string

    DashboardStats:
      type: object
      required: [totalContacts, totalInteractions, overdueFollowUps, contactsByCategory, interactionsByMonth, relationshipBreakdown, recentActivity]
      properties:
        totalContacts:
          type: integer
        totalInteractions:
          type: integer
        overdueFollowUps:
          type: integer
        contactsByCategory:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
        interactionsByMonth:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month:
                type: string
              count:
                type: integer
        relationshipBreakdown:
          type: array
          items:
            type: object
            required: [level, count]
            properties:
              level:
                type: string
              count:
                type: integer
        agingContacts:
          type: integer
        recentActivity:
          type: array
          items:
            type: object
            required: [id, action, timestamp]
            properties:
              id:
                type: string
              action:
                type: string
              timestamp:
                type: string
              user:
                type: [string, 'null']

    AuditLog:
      type: object
      required: [id, userEmail, action, entityType, entityId, timestamp]
      properties:
        id:
          type: string
        userEmail:
          type: [string, 'null']
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: [string, 'null']
        details:
          type: [string, 'null']
        timestamp:
          type: string
